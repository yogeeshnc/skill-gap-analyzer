<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Gap Analyzer - Prototype</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-soft">
    <div class="container py-4 py-md-5">
      <header class="text-center mb-4">
        <h1 class="fw-bold mb-2">Skill Gap Analyzer</h1>
        <p class="text-secondary mb-0">Searchable dropdown prototype with pending approval workflow</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">
          <a href="admin-login.html" class="btn btn-outline-dark">Admin Dashboard</a>
        </div>
      </header>

      <div id="flashMessage" class="alert d-none" role="alert"></div>

      <main class="row g-4 justify-content-center">
        <section class="col-12 col-lg-8">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">User Analysis</h2>
              <div id="sessionHeader" class="mb-3 d-none">
                <div class="alert alert-info mb-3">
                  Signed in as <strong id="sessionName"></strong> (<span id="sessionEmail"></span>)
                  <button type="button" id="logoutBtn" class="btn btn-link btn-sm">Logout</button>
                </div>
              </div>
              <form id="analysisForm" class="row g-3">
                <input type="hidden" id="name" />
                <input type="hidden" id="email" />
                <input type="hidden" id="password" />
                <div class="col-12">
                  <label class="form-label fw-semibold">Logged in as</label>
                  <div id="userInfo" class="form-control form-control-lg bg-light text-muted"></div>
                </div>
                <div class="col-12">
                  <label for="jobRole" class="form-label fw-semibold">Job Role (Search or type custom)</label>
                  <select id="jobRole" placeholder="Type to search jobs..." required></select>
                </div>
                <div class="col-12">
                  <label for="skills" class="form-label fw-semibold">Skills (Search, multi-select, or add custom)</label>
                  <select id="skills" multiple placeholder="Type to search skills..." required></select>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary btn-lg px-4">Analyze Skill Gap</button>
                </div>
              </form>

              <div id="analysisResult" class="result d-none mt-4"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script defer src="../js/script.js"></script>
  </body>
</html>
