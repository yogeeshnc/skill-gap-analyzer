<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email - Skill Gap Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-soft">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h1 class="h4 mb-3 text-center">Verify Your Email</h1>
              <div id="verifyFlash" class="alert d-none" role="alert"></div>
              <form id="verifyForm" class="row g-3">
                <div class="col-12">
                  <label for="verifyEmail" class="form-label">Email</label>
                  <input type="email" id="verifyEmail" class="form-control form-control-lg" placeholder="Enter your email" required />
                </div>
                <div class="col-12">
                  <label for="verifyCode" class="form-label">Verification Code</label>
                  <input type="text" id="verifyCode" class="form-control form-control-lg" placeholder="Enter verification code" required />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Verify Email</button>
                </div>
                <div class="col-12 text-center mt-2">
                  <button type="button" id="resendBtn" class="btn btn-link">Resend verification code</button>
                </div>
              </form>
              <p class="text-center mt-3 mb-0">
                Already verified? <a href="login.html">Log in</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="../js/verify.js"></script>
  </body>
</html>
