<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Skill Gap Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-soft">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h1 class="h4 mb-3 text-center">Create an Account</h1>
              <div id="signupFlash" class="alert d-none" role="alert"></div>
              <form id="signupForm" class="row g-3">
                <div class="col-12">
                  <label for="signupName" class="form-label">Name</label>
                  <input type="text" id="signupName" class="form-control form-control-lg" placeholder="Enter your name" required />
                </div>
                <div class="col-12">
                  <label for="signupEmail" class="form-label">Email</label>
                  <input type="email" id="signupEmail" class="form-control form-control-lg" placeholder="Enter your email" required />
                </div>
                <div class="col-12">
                  <label for="signupPassword" class="form-label">Password</label>
                  <input type="password" id="signupPassword" class="form-control form-control-lg" placeholder="Create a password" required />
                  <div class="form-text">Minimum 8 characters, with uppercase, lowercase, number, and special character.</div>
                </div>
                <div class="col-12">
                  <label for="signupConfirmPassword" class="form-label">Confirm Password</label>
                  <input type="password" id="signupConfirmPassword" class="form-control form-control-lg" placeholder="Confirm password" required />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                </div>
              </form>
              <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="login.html">Log in</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="../js/signup.js"></script>
  </body>
</html>
