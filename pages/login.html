<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - Skill Gap Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-soft">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
              <h1 class="h4 mb-3 text-center">Log In</h1>
              <div id="loginFlash" class="alert d-none" role="alert"></div>
              <form id="loginForm" class="row g-3">
                <div class="col-12">
                  <label for="loginEmail" class="form-label">Email</label>
                  <input type="email" id="loginEmail" class="form-control form-control-lg" placeholder="Enter your email" required />
                </div>
                <div class="col-12">
                  <label for="loginPassword" class="form-label">Password</label>
                  <input type="password" id="loginPassword" class="form-control form-control-lg" placeholder="Enter your password" required />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                </div>
                <div class="col-12 text-center my-2">
                  <span class="text-muted">OR</span>
                </div>
                <div class="col-12 d-grid">
                  <a href="admin-login.html" class="btn btn-warning btn-lg">Admin Login</a>
                </div>
              </form>
              <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="signup.html">Sign up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="../js/login.js"></script>
  </body>
</html>
