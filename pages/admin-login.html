<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Skill Gap Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-soft">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
              <h1 class="h3 mb-3 text-center">Admin Login</h1>
              <p class="text-secondary text-center mb-4">Access dashboard for approvals and status management.</p>

              <div id="loginFlash" class="alert d-none" role="alert"></div>

              <form id="adminLoginForm" class="row g-3">
                <div class="col-12">
                  <label for="adminEmail" class="form-label">Email</label>
                  <input id="adminEmail" type="email" class="form-control form-control-lg" required />
                </div>
                <div class="col-12">
                  <label for="adminPassword" class="form-label">Password</label>
                  <input id="adminPassword" type="password" class="form-control form-control-lg" required />
                </div>
                <div class="col-12 d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>
              </form>

              <div class="mt-3 text-center">
                <a href="index.html" class="text-decoration-none">Back to User Portal</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script defer src="../js/admin-login.js"></script>
  </body>
</html>
